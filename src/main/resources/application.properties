spring.config.import=file:./.env[.properties]

# Application Configuration
spring.application.name=goimaster-api
server.port=8080

# Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-key=${SUPABASE_SERVICE_KEY:your-service-key}

# Database Configuration (PostgreSQL from Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# validate = check schema matches (production)
# update = auto create/update tables (development only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Note: PostgreSQLDialect is auto-detected, no need to specify
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# CORS Configuration
# Allow localhost and local network IPs (for development)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Content-Type,X-User-Id,X-Requested-With,Accept,Origin
cors.allow-credentials=true
cors.max-age=3600

# Logging
logging.level.com.goimaster=DEBUG
logging.level.org.springframework.web=INFO

